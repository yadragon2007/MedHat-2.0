<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacemaker Monitor</title>
<style>
  :root {
    --paper: #fbf4f0;
    --grid: #efd2cb;
    --ink: #2a2225;
    --muted: #7a6a6e;
    --card: #fffaf7;
    --line: #e3c3bb;
    --ok: #2e8b57;
    --bad: #c0392b;
    --wait: #c98a1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1d1719;
      --grid: #3a2b2f;
      --ink: #f3e8e4;
      --muted: #b09ca1;
      --card: #251d20;
      --line: #4a373c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    /* ECG-paper grid: fine 1 mm squares, heavier 5 mm squares */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    background-position: -1px -1px;
    min-height: 100vh;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 20px clamp(14px, 3vw, 32px) 8px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700; font-size: clamp(1.4rem, 3vw, 2rem); margin: 0; letter-spacing: -0.01em;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--wait); }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }
  .tools { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: .85rem; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  main {
    display: grid; gap: 14px; padding: 8px clamp(14px, 3vw, 32px) 32px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px 10px; min-width: 0;
  }
  .card.wide { grid-column: 1 / -1; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card h2 { margin: 0; font-size: 1rem; font-weight: 600; }
  .card .sub { margin: 2px 0 0; font-size: .8rem; color: var(--muted); }
  .value { font-family: Georgia, serif; font-size: 1.9rem; font-weight: 700; white-space: nowrap; }
  .value small { font-family: system-ui, sans-serif; font-size: .8rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .chart-box { position: relative; height: 200px; margin-top: 6px; }
  .card.wide .chart-box { height: 240px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Pacemaker Monitor</h1>
  <div class="status" role="status" aria-live="polite">
    <span class="dot" id="dot"></span><span id="statusText">Connecting…</span>
  </div>
  <div class="tools">
    <button id="pauseBtn" type="button">Pause</button>
    <button id="clearBtn" type="button">Clear</button>
  </div>
</header>

<main id="grid"></main>

<script src="chart.umd.js"></script>
<script>
/* ============================================================
   CONFIG – edit this part to match your ESP
   ============================================================ */
const CONFIG = {
  // WebSocket address. Default: same host that served this page, path /ws.
  // Override without editing: index.html?host=192.168.4.1
  wsPath: "/ws",
  windowSeconds: 30,      // how much history each graph shows
  maxFps: 30,             // redraw rate limit

  // One entry per graph. `key` is the JSON field the ESP sends.
  charts: [
    { key: "hr",    title: "Heart rate",              sub: "Unhealthy heart, no pacemaker",
      unit: "bpm", color: "#c0392b", wide: true,  decimals: 0 },
    { key: "pm",    title: "Pacemaker only",         sub: "Isolated pacemaker output",
      unit: "",    color: "#1f7a8c", decimals: 2 },
    { key: "comb",  title: "Combined",               sub: "Heart + pacemaker",
      unit: "",    color: "#7b4fa3", decimals: 2 },
    { key: "temp",  title: "Temperature",            sub: "Temperature sensor",
      unit: "°C",  color: "#d27a12", decimals: 1 },
    { key: "sweat", title: "Sweat",                  sub: "Sweat sensor",
      unit: "",    color: "#2f6fcf", decimals: 0 }
  ]
};

/* State – must be declared BEFORE the charts are built */
let xNow = 0;           // latest x (seconds) – right edge of every graph
let t0 = null;          // first ESP timestamp seen (ms), to start at 0
let paused = false;
let dirty = false;

/* ============================================================
   Build the cards + charts
   ============================================================ */
const css = getComputedStyle(document.documentElement);
const cssVar = n => css.getPropertyValue(n).trim();
const grid = document.getElementById("grid");

const panels = {};   // key -> { cfg, chart, valueEl, data }

CONFIG.charts.forEach(cfg => {
  const card = document.createElement("section");
  card.className = "card" + (cfg.wide ? " wide" : "");
  card.innerHTML =
    '<div class="card-head">' +
      '<div><h2></h2><p class="sub"></p></div>' +
      '<div class="value"><span class="num">--</span><small></small></div>' +
    '</div>' +
    '<div class="chart-box"><canvas></canvas></div>';
  card.querySelector("h2").textContent = cfg.title;
  card.querySelector(".sub").textContent = cfg.sub;
  card.querySelector("small").textContent = cfg.unit;
  grid.appendChild(card);

  const data = [];
  const chart = new Chart(card.querySelector("canvas"), {
    type: "line",
    data: { datasets: [{
      data,
      borderColor: cfg.color,
      backgroundColor: cfg.color,
      borderWidth: 2,
      pointRadius: 0,
      tension: 0,
      spanGaps: false
    }]},
    options: {
      parsing: false,
      normalized: true,
      animation: false,
      maintainAspectRatio: false,
      interaction: { mode: "nearest", intersect: false },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          type: "linear",
          ticks: { maxTicksLimit: 6, color: cssVar("--muted"),
                   callback: v => (v - xNow).toFixed(0) + "s" },
          grid: { display: false },
          border: { color: cssVar("--line") }
        },
        y: {
          ...(cfg.min !== undefined ? { min: cfg.min } : {}),
          ...(cfg.max !== undefined ? { max: cfg.max } : {}),
          grace: "10%",
          ticks: { color: cssVar("--muted"), maxTicksLimit: 5 },
          grid: { color: cssVar("--grid") },
          border: { display: false }
        }
      }
    }
  });
  panels[cfg.key] = { cfg, chart, data, valueEl: card.querySelector(".num") };
});



function xFromSample(s) {
  if (typeof s.t === "number") {
    if (t0 === null) t0 = s.t;
    return (s.t - t0) / 1000;
  }
  return performance.now() / 1000;      // fallback: arrival time
}

function addSample(s) {
  if (!s || typeof s !== "object") return;
  const x = xFromSample(s);
  if (x > xNow) xNow = x;
  for (const key in panels) {
    const v = s[key];
    if (typeof v !== "number" || !isFinite(v)) continue;
    const p = panels[key];
    p.data.push({ x, y: v });
    p.valueEl.textContent = v.toFixed(p.cfg.decimals);
  }
  dirty = true;
}

function onMessage(text) {
  let msg;
  try { msg = JSON.parse(text); } catch { return; }
  if (Array.isArray(msg)) msg.forEach(addSample); else addSample(msg);
}

function trimAndDraw() {
  const minX = xNow - CONFIG.windowSeconds;
  for (const key in panels) {
    const { data, chart } = panels[key];
    let drop = 0;
    while (drop < data.length && data[drop].x < minX - 1) drop++;
    if (drop) data.splice(0, drop);
    chart.options.scales.x.min = minX;
    chart.options.scales.x.max = xNow;
    chart.update("none");
  }
}

let lastDraw = 0;
function loop(now) {
  if (dirty && !paused && now - lastDraw >= 1000 / CONFIG.maxFps) {
    lastDraw = now;
    dirty = false;
    trimAndDraw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   WebSocket with auto-reconnect
   ============================================================ */
const params = new URLSearchParams(location.search);
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");

function setStatus(state, text) {
  dot.className = "dot " + state;
  statusText.textContent = text;
}

let retry = 0;
function connect() {
  const host = params.get("host") || location.host;
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  const url = proto + host + CONFIG.wsPath;
  setStatus("", "Connecting…");
  const ws = new WebSocket(url);

  ws.onopen = () => { retry = 0; setStatus("on", "Live"); };
  ws.onmessage = e => { if (!paused) onMessage(e.data); };
  ws.onclose = () => {
    setStatus("off", "Disconnected – retrying…");
    setTimeout(connect, Math.min(1000 * 2 ** retry++, 5000));
  };
  ws.onerror = () => ws.close();
}

/* ============================================================
   Controls
   ============================================================ */
const pauseBtn = document.getElementById("pauseBtn");
pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "Resume" : "Pause";
  if (!paused) dirty = true;
};
document.getElementById("clearBtn").onclick = () => {
  for (const key in panels) { panels[key].data.length = 0; panels[key].valueEl.textContent = "--"; }
  dirty = true;
};

/* ============================================================
   Demo mode – open index.html?demo to test without an ESP
   ============================================================ */
function startDemo() {
  setStatus("on", "Demo data (no ESP)");
  const start = performance.now();
  setInterval(() => {
    const t = performance.now() - start;
    const s = t / 1000;
    const bpm = 48 + 6 * Math.sin(s / 3) + (Math.random() - 0.5) * 2;   // slow heart
    const beat = (Math.sin(s * 2 * Math.PI * 1.2) > 0.97) ? 1 : 0;
    const pm = (Math.sin(s * 2 * Math.PI * 1.1) > 0.97) ? 1 : 0;
    onMessage(JSON.stringify({
      t,
      hr: bpm,
      pm: pm * 1.0 + (Math.random() - 0.5) * 0.03,
      comb: beat * 0.8 + pm * 0.6 + (Math.random() - 0.5) * 0.03,
      temp: 36.6 + 0.3 * Math.sin(s / 7) + (Math.random() - 0.5) * 0.05,
      sweat: 300 + 40 * Math.sin(s / 5) + Math.random() * 6
    }));
  }, 40);
}

if (params.has("demo")) startDemo(); else connect();
</script>
</body>
</html>
